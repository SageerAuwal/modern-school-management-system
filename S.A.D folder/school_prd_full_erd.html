<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  SCHOOL ||--o{ USER : employs
  SCHOOL ||--o{ STUDENT : enrolls
  SCHOOL ||--o{ CLASS_SECTION : offers
  STUDENT ||--o{ ENROLLMENT : has
  CLASS_SECTION ||--o{ ENROLLMENT : has
  CLASS_SECTION ||--o{ ATTENDANCE : records
  STUDENT ||--o{ ATTENDANCE : has
  CLASS_SECTION ||--o{ GRADE : records
  STUDENT ||--o{ GRADE : receives
  STUDENT ||--o{ INVOICE : billed
  INVOICE ||--o{ PAYMENT : receives
  USER ||--o{ CLASS_SECTION : teaches
  STUDENT ||--o{ BEHAVIOR_INCIDENT : has
  USER ||--o{ MESSAGE_THREAD : participates
  STUDENT ||--o{ HEALTH_RECORD : has
  STUDENT ||--o{ LIBRARY_LOAN : has
  STUDENT ||--o{ TRANSPORT_ASSIGNMENT : has
  USER ||--o{ VIOLATION_LOG : flagged_on
  STUDENT ||--o{ FACE_ENROLLMENT : has
  SCHOOL {
    uuid id PK
    string name
    string emis_id
    string exam_center_no
    float gps_lat
    float gps_lng
    string lga
    string state
    string ownership_type
  }
  USER {
    uuid id PK
    uuid school_id FK
    string role
    string email
  }
  STUDENT {
    uuid id PK
    uuid school_id FK
    string name
    date dob
  }
  CLASS_SECTION {
    uuid id PK
    uuid teacher_id FK
    string subject
    string term
  }
  ENROLLMENT {
    uuid id PK
    uuid student_id FK
    uuid section_id FK
  }
  ATTENDANCE {
    uuid id PK
    uuid student_id FK
    date date
    string status
    string source
  }
  GRADE {
    uuid id PK
    uuid student_id FK
    string assessment
    float score
  }
  INVOICE {
    uuid id PK
    uuid student_id FK
    float amount
    string status
  }
  PAYMENT {
    uuid id PK
    uuid invoice_id FK
    string paystack_ref
    date paid_at
  }
  BEHAVIOR_INCIDENT {
    uuid id PK
    uuid student_id FK
    string severity
    string description
  }
  MESSAGE_THREAD {
    uuid id PK
    uuid student_id FK
    uuid teacher_id FK
    uuid parent_id FK
  }
  HEALTH_RECORD {
    uuid id PK
    uuid student_id FK
    string condition
    string access_level
  }
  LIBRARY_LOAN {
    uuid id PK
    uuid student_id FK
    string book_id
    date due_date
  }
  TRANSPORT_ASSIGNMENT {
    uuid id PK
    uuid student_id FK
    string route_id
  }
  VIOLATION_LOG {
    uuid id PK
    uuid user_id FK
    string signal_type
    string status
  }
  FACE_ENROLLMENT {
    uuid id PK
    uuid student_id FK
    boolean consent_given
    date enrolled_at
  }
`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
